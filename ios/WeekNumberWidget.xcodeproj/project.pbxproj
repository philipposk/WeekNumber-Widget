			shellScript = "set -e\nAPPEX_PATH=\"${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}\"\nINFO_PLIST=\"${APPEX_PATH}/Info.plist\"\necho \"[Fix NSExtension] Looking for Info.plist at: $INFO_PLIST\"\n\n# Wait for Info.plist to be created (with timeout)\nfor i in {1..10}; do\n    if [ -f \"$INFO_PLIST\" ]; then\n        break\n    fi\n    echo \"[Fix NSExtension] Waiting for Info.plist... ($i/10)\"\n    sleep 0.5\ndone\n\nif [ ! -f \"$INFO_PLIST\" ]; then\n    echo \"[Fix NSExtension] ERROR: Info.plist not found after waiting\"\n    ls -la \"${BUILT_PRODUCTS_DIR}/\" 2>&1 || true\n    exit 1\nfi\n\necho \"[Fix NSExtension] Info.plist found, checking for NSExtension...\"\n\n# Check if NSExtension exists\nif ! /usr/libexec/PlistBuddy -c \"Print NSExtension\" \"$INFO_PLIST\" >/dev/null 2>&1; then\n    echo \"[Fix NSExtension] NSExtension missing, adding it...\"\n    \n    # Add NSExtension dictionary\n    /usr/libexec/PlistBuddy -c \"Add NSExtension dict\" \"$INFO_PLIST\" 2>&1 || {\n        echo \"[Fix NSExtension] Failed to add NSExtension dict\"\n        exit 1\n    }\n    \n    # Add NSExtensionPointIdentifier\n    /usr/libexec/PlistBuddy -c \"Add NSExtension:NSExtensionPointIdentifier string com.apple.widgetkit-extension\" \"$INFO_PLIST\" 2>&1 || {\n        echo \"[Fix NSExtension] Failed to add NSExtensionPointIdentifier\"\n        exit 1\n    }\n    \n    echo \"[Fix NSExtension] ✓ Successfully added NSExtension to Info.plist\"\n    \n    # Verify it was added\n    if /usr/libexec/PlistBuddy -c \"Print NSExtension:NSExtensionPointIdentifier\" \"$INFO_PLIST\" >/dev/null 2>&1; then\n        echo \"[Fix NSExtension] ✓ Verified NSExtension is present\"\n    else\n        echo \"[Fix NSExtension] ERROR: Verification failed\"\n        exit 1\n    fi\nelse\n    echo \"[Fix NSExtension] ✓ NSExtension already exists\"\nfi\n";
