name: WeekNumberWidget
options:
  bundleIdPrefix: com.weeknumber
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  WeekNumberWidget:
    type: application
    platform: iOS
    sources:
      - path: WeekNumberWidget
      - path: Shared
    entitlements:
      path: WeekNumberWidget/WeekNumberWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.weeknumber.widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeknumber.widget
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Week Number
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: WeekNumberWidgetExtension

  WeekNumberWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WeekNumberWidgetExtension
      - path: Shared
    info:
      path: WeekNumberWidgetExtension/Generated-Info.plist
      properties:
        CFBundleDisplayName: Week Number
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WeekNumberWidgetExtension/WeekNumberWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.weeknumber.widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeknumber.widget.widget
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  WeekNumberWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeekNumberWidgetTests
    dependencies:
      - target: WeekNumberWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeknumber.widget.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WeekNumberWidget:
    build:
      targets:
        WeekNumberWidget: all
    test:
      targets:
        - WeekNumberWidgetTests
      gatherCoverageData: true
