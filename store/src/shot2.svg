<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA3F5"/><stop offset="1" stop-color="#2E6FC7"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg2)"/>

  <text x="540" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" fill="#FFFFFF">Monday or Sunday</text>
  <text x="540" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="64" font-weight="600" fill="#E3ECF7">ISO 8601 or US — your call</text>

  <!-- phone with in-app screen -->
  <g transform="translate(240,430)">
    <rect x="0" y="0" width="600" height="1240" rx="78" fill="#0B0B0B"/>
    <rect x="20" y="20" width="560" height="1200" rx="60" fill="#FAFAFA"/>

    <!-- hero card -->
    <g transform="translate(60,90)">
      <rect width="480" height="300" rx="44" fill="#F0F0F0"/>
      <text x="240" y="96" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="26" font-weight="700" letter-spacing="4" fill="#6E6E6E">WEEK</text>
      <text x="240" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="150" font-weight="800" fill="#1A1A1A">25</text>
    </g>

    <!-- segmented toggle -->
    <g transform="translate(60,430)">
      <rect width="480" height="96" rx="24" fill="#E6E6E6"/>
      <rect x="6" y="6" width="234" height="84" rx="20" fill="#FFFFFF"/>
      <text x="123" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="34" font-weight="700" fill="#1A1A1A">Monday</text>
      <text x="363" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="34" font-weight="600" fill="#6E6E6E">Sunday</text>
    </g>

    <!-- this week card -->
    <g transform="translate(60,560)">
      <rect width="480" height="300" rx="36" fill="#F0F0F0"/>
      <text x="32" y="64" font-family="Helvetica, Arial, sans-serif"
            font-size="24" font-weight="700" letter-spacing="2" fill="#6E6E6E">THIS WEEK</text>
      <text x="32" y="130" font-family="Helvetica, Arial, sans-serif"
            font-size="34" font-weight="500" fill="#1A1A1A">Jun 15 – Jun 21</text>
      <text x="32" y="186" font-family="Helvetica, Arial, sans-serif"
            font-size="34" font-weight="500" fill="#1A1A1A">193 days left in the year</text>
      <rect x="32" y="222" width="416" height="16" rx="8" fill="#D8D8D8"/>
      <rect x="32" y="222" width="190" height="16" rx="8" fill="#4A90E2"/>
      <text x="32" y="280" font-family="Helvetica, Arial, sans-serif"
            font-size="26" font-weight="500" fill="#6E6E6E">46% of the year</text>
    </g>
  </g>
</svg>
