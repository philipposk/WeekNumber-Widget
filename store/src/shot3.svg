<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA3F5"/><stop offset="1" stop-color="#2E6FC7"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13325F"/><stop offset="1" stop-color="#06182F"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg3)"/>

  <text x="540" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" fill="#FFFFFF">Home &amp; Lock Screen</text>
  <text x="540" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="60" font-weight="600" fill="#E3ECF7">Widgets where you need them</text>

  <!-- phone with lock screen + accessory widgets -->
  <g transform="translate(240,430)">
    <rect x="0" y="0" width="600" height="1240" rx="78" fill="#0B0B0B"/>
    <rect x="20" y="20" width="560" height="1200" rx="60" fill="url(#lock)"/>

    <!-- clock -->
    <text x="300" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="60" font-weight="500" fill="#FFFFFF" opacity="0.85">Monday 15 June</text>
    <text x="300" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="220" font-weight="700" fill="#FFFFFF">9:41</text>

    <!-- accessory widgets row under clock -->
    <g transform="translate(120,500)">
      <circle cx="60" cy="60" r="60" fill="#FFFFFF" opacity="0.18"/>
      <text x="60" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="22" font-weight="600" fill="#FFFFFF">WK</text>
      <text x="60" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="44" font-weight="800" fill="#FFFFFF">25</text>
    </g>
    <g transform="translate(270,500)">
      <rect width="210" height="120" rx="28" fill="#FFFFFF" opacity="0.18"/>
      <text x="28" y="74" font-family="Helvetica, Arial, sans-serif"
            font-size="46" font-weight="700" fill="#FFFFFF">Week 25</text>
    </g>

    <!-- a home-screen widget peeking (transparent on wallpaper) -->
    <g transform="translate(150,760)">
      <text x="150" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="26" font-weight="700" letter-spacing="3" fill="#FFFFFF" opacity="0.8">WEEK</text>
      <text x="150" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="170" font-weight="800" fill="#FFFFFF">25</text>
    </g>
  </g>
</svg>
