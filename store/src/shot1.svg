<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA3F5"/><stop offset="1" stop-color="#2E6FC7"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F5298"/><stop offset="1" stop-color="#0E2E5C"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <text x="540" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" fill="#FFFFFF">Know your week</text>
  <text x="540" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" fill="#FFFFFF">at a glance</text>

  <!-- phone -->
  <g transform="translate(240,430)">
    <rect x="0" y="0" width="600" height="1240" rx="78" fill="#0B0B0B"/>
    <rect x="20" y="20" width="560" height="1200" rx="60" fill="url(#wall)"/>
    <!-- status bar dots -->
    <rect x="250" y="46" width="100" height="26" rx="13" fill="#000000" opacity="0.55"/>

    <!-- large widget -->
    <g transform="translate(70,150)">
      <rect width="460" height="300" rx="46" fill="#FFFFFF"/>
      <text x="230" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="30" font-weight="700" letter-spacing="3" fill="#6E6E6E">WEEK</text>
      <text x="230" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="150" font-weight="800" fill="#1A1A1A">25</text>
    </g>

    <!-- two small widgets row -->
    <g transform="translate(70,500)">
      <rect width="210" height="210" rx="40" fill="#4A90E2"/>
      <text x="105" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="110" font-weight="800" fill="#FFFFFF">25</text>
    </g>
    <g transform="translate(320,500)">
      <rect width="210" height="210" rx="40" fill="#FFFFFF" opacity="0.92"/>
      <text x="105" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="22" font-weight="700" letter-spacing="2" fill="#6E6E6E">WEEK</text>
      <text x="105" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
            font-size="96" font-weight="800" fill="#1A1A1A">25</text>
    </g>

    <!-- dock hint -->
    <rect x="70" y="760" width="460" height="120" rx="36" fill="#FFFFFF" opacity="0.16"/>
  </g>
</svg>
